# --- SERVER CONFIGURATION ---
server.port=8080

# --- SPRING PROFILE CONTROLS ---
# Default to 'dev' profile for instant local coding with H2 database.
spring.profiles.active=dev

# --- SPRING SECURITY CORS CONFIG ---
# Allow frontend communication
cors.allowed-origins=http://localhost:5000,http://127.0.0.1:5000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,https://howards4hope-b06f6.web.app,https://howards4hope-b06f6.firebaseapp.com,https://howards4hope.org,https://www.howards4hope.org

# --- SPRING CLOUD GCP CONTROLS ---
# Default to false for standalone/local development without GCP credentials
spring.cloud.gcp.core.enabled=${SPRING_CLOUD_GCP_ENABLED:false}
spring.cloud.gcp.pubsub.enabled=${SPRING_CLOUD_GCP_PUBSUB_ENABLED:false}
spring.cloud.gcp.firestore.enabled=false
spring.cloud.gcp.storage.enabled=false

# --- STRIPE & PAYPAL PAYMENT INTEGRATIONS ---
stripe.api.key=${STRIPE_API_KEY:}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_mock_secret}

paypal.client.id=${PAYPAL_CLIENT_ID:mock_paypal_client_id}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:mock_paypal_client_secret}
paypal.mode=${PAYPAL_MODE:sandbox}

# --- SMTP EMAIL SERVICE (Google Workspace / Gmail / Custom SMTP) ---
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:howards4hope@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

