# --- SERVER CONFIGURATION ---
server.port=8080

# --- SPRING PROFILE CONTROLS ---
# Default to 'dev' profile for instant local coding with H2 database.
spring.profiles.active=dev

# --- SPRING SECURITY CORS CONFIG ---
# Allow frontend communication
cors.allowed-origins=http://localhost:5000,http://localhost:3000,http://localhost:8080,https://howards4hope-b06f6.web.app,https://howards4hope-b06f6.firebaseapp.com

# --- STRIPE & PAYPAL PAYMENT INTEGRATIONS ---
stripe.api.key=${STRIPE_API_KEY:sk_test_mock_key_for_dev}
